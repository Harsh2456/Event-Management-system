<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – upGrad EMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">
        <i class="bi bi-lightning-charge-fill me-2"></i>upGrad EMS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-fill me-1"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html"><i class="bi bi-person-lock me-1"></i>Login</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#events-section"><i class="bi bi-calendar-event me-1"></i>Events</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html"><i class="bi bi-envelope me-1"></i>Contact Us</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Card -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 mt-3">
          <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
            <i class="bi bi-person-badge display-5"></i>
            <h4 class="mt-2 mb-0 fw-bold">Admin Login</h4>
            <p class="small mb-0 opacity-75">Access the Event Management Dashboard</p>
          </div>
          <div class="card-body p-4">
            <div id="login-alert" class="alert alert-danger d-none" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span id="login-alert-msg">Invalid email or password.</span>
            </div>
            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope-fill text-primary"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="admin@upgrad.com" required />
                  <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill text-primary"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="Enter password" required />
                  <button class="btn btn-outline-secondary" type="button" id="toggle-pwd" title="Show/hide password">
                    <i class="bi bi-eye" id="eye-icon"></i>
                  </button>
                  <div class="invalid-feedback">Password is required.</div>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
              </div>
            </form>
            <div class="text-center mt-3">
              <small class="text-muted">
                <i class="bi bi-info-circle me-1"></i>
                Demo credentials: <code>admin@upgrad.com</code> / <code>12345</code>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1"><i class="bi bi-lightning-charge-fill text-warning me-2"></i><strong>upGrad EMS</strong></p>
      <small class="text-muted">&copy; 2025 upGrad. All rights reserved.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
